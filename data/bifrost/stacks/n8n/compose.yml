# n8n — déployé par bifrost (Yggdrasil)
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "${BIND_ADDR}:${PORT}:5678"
    environment:
      GENERIC_TIMEZONE: "${TZ}"
      TZ: "${TZ}"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ./data:/home/node/.n8n
    restart: unless-stopped

networks:
  default:
    name: bifrost
    external: true
