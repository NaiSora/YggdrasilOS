# Yggdrasil : partitionnement proposé par l'installateur.
#   - btrfs par défaut, en sous-volumes @ et @home (voir mount.conf) : les Nornes y
#     prennent des instantanés immédiats, visibles au menu de démarrage ;
#   - « Chiffrer le système » proposé sur la page « Effacer le disque » (LUKS2) ;
#   - /boot à part et en clair : la phrase secrète est alors demandée au démarrage du
#     système, avec le clavier français. (Chiffré, /boot devrait être ouvert par GRUB,
#     qui ne connaît que le clavier QWERTY : une phrase tapée en AZERTY y échouerait.)
#     Calamares ne crée alors aucun fichier-clé : rien de secret ne traîne sur /boot ;
#   - pas de partition d'échange par défaut : la mémoire compressée (zram) s'en charge.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

enableLuksAutomatedPartitioning: true
# GRUB n'ouvre pas la racine (/boot est à part) : LUKS2, avec Argon2id
luksGeneration: luks2
# /boot en clair est un choix (voir plus haut) : pas d'avertissement inquiétant
showNotEncryptedBootMessage: false

partitionLayout:
    - name: "yggdrasil-boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1GiB
    - name: "yggdrasil"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
