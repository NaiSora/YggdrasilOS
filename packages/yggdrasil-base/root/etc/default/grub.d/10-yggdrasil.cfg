# Réglages GRUB d'Yggdrasil (paquet yggdrasil-base).
# Pour les modifier, crée un fichier /etc/default/grub.d/99-local.cfg puis lance « sudo update-grub ».
# Lu (sourcé) par grub-mkconfig, qui se sert de ces variables :
# shellcheck shell=sh disable=SC2034
GRUB_DISTRIBUTOR="Yggdrasil"
GRUB_TIMEOUT=5
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_GFXMODE="auto"
GRUB_THEME="/usr/share/grub/themes/yggdrasil/theme.txt"

# Calamares lance ses commandes avec LC_ALL=C : le menu sortait en anglais (« Advanced options
# for… ») jusqu'à la mise à jour suivante. On reprend la langue du système installé, que
# Calamares a écrite dans /etc/default/locale avant d'installer le chargeur d'amorçage.
if [ "${LC_ALL:-}" = C ] && [ -r "${YGG_LOCALE:-/etc/default/locale}" ]; then
    unset LC_ALL
    # (grub-mkconfig tourne sous set -e : un fichier illisible ne doit pas l'arrêter)
    # shellcheck source=/dev/null
    LANG=$(. "${YGG_LOCALE:-/etc/default/locale}" >/dev/null 2>&1; printf '%s' "${LANG:-C}") || LANG=C
    export LANG
fi
