# Yggdrasil — l'installateur en mode texte (Debian Installer) : réponses par défaut.
# Langue, clavier et fuseau sont réglés pour la France ; le nom de la machine est
# proposé ; le disque, le compte et son mot de passe sont demandés comme d'habitude.

# Langue et clavier
d-i debian-installer/locale string fr_FR.UTF-8
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i localechooser/supported-locales multiselect fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr(latin9)

# Réseau : « yggdrasil » proposé, modifiable
d-i netcfg/get_hostname string yggdrasil
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/get_domain seen false

# Horloge
d-i time/zone string Europe/Paris
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Comptes : pas de mot de passe root, le premier compte administre avec sudo
d-i passwd/root-login boolean false
d-i passwd/user-default-groups string audio cdrom dip floppy video plugdev netdev scanner bluetooth lpadmin sudo docker

# Sources APT : miroir Debian, sécurité, mises à jour, micrologiciels
d-i apt-setup/use_mirror boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/disable-cdrom-entries boolean true
popularity-contest popularity-contest/participate boolean false

# Le système installé ne garde rien de la session live (ni Calamares)
d-i preseed/late_command string in-target sh -c 'for p in calamares calamares-settings-debian yggdrasil-calamares live-boot live-boot-initramfs-tools live-config live-config-systemd live-tools; do dpkg -s "$p" >/dev/null 2>&1 && DEBIAN_FRONTEND=noninteractive apt-get purge -y "$p" >/dev/null 2>&1; done; true'

# Chargeur UEFI aussi au chemin de secours (micrologiciels qui oublient leurs entrées)
d-i grub-installer/force-efi-extra-removable boolean true
